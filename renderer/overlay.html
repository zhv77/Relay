<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Relay overlay</title>
  <style>
    :root {
      --bg: rgba(17, 19, 23, 0.93);
      --line: rgba(255, 255, 255, 0.09);
      --text: #dfe3ea;
      --muted: #8b93a1;
      --good: #8fbf8f;
      --okay: #d7c27a;
      --bad: #d98c8c;
      --riven: #b89cff;
    }
    html, body { margin: 0; background: transparent; overflow: hidden; }
    body { font: 13px/1.45 "Segoe UI", system-ui, sans-serif; color: var(--text); }
    .card {
      background: var(--bg); border: 1px solid rgba(184, 156, 255, 0.35); border-radius: 8px;
      padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
    }
    .card.old { border-color: var(--line); }
    .label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--riven); }
    .old .label { color: var(--muted); }
    .name { font-size: 18px; font-weight: 600; margin: 2px 0 2px; }
    .meta { color: var(--muted); font-size: 12px; }
    .dots { color: var(--riven); letter-spacing: 1px; }
    .facts { display: flex; gap: 20px; margin-top: 10px; }
    .fact b { display: block; font-size: 19px; font-weight: 600; }
    .great, .good-text { color: var(--good); }
    .mixed { color: var(--okay); }
    .weak, .bad-text { color: var(--bad); }
    .stats { margin: 10px 0 0; padding: 0; list-style: none; }
    .stats li { padding: 3px 0; }
    .stats .line { display: flex; align-items: center; gap: 8px; }
    .stats .text { flex: 1; }
    .stats li.bad .text { color: var(--bad); }
    .pill { font-size: 11px; padding: 0 6px; border-radius: 9px; background: rgba(255, 255, 255, 0.06); white-space: nowrap; }
    .r3, .harmless { color: var(--good); }
    .r2 { color: var(--good); opacity: .85; }
    .r1 { color: var(--okay); }
    .r0, .hurts { color: var(--bad); }
    .locked { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--riven); }
    .locked svg { width: 10px; height: 10px; fill: currentColor; }
    .roll { display: flex; align-items: center; gap: 8px; margin-top: 3px; font-size: 11px; color: var(--muted); }
    .bar { flex: 1; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--riven); }
    .note { color: var(--muted); font-size: 11px; margin-top: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 0; font-size: 13.5px; line-height: 1.5; }
    th { white-space: nowrap; text-align: left; font-weight: 600; color: var(--muted); font-size: 12.5px; padding: 0 8px 5px 0; border-bottom: 1px solid var(--line); }
    td { padding: 1px 8px 1px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.04); white-space: nowrap; }
    td.range { color: var(--muted); font-variant-numeric: tabular-nums; }
    tr.mine td { background: rgba(184, 156, 255, 0.12); }
    tr.mine td:first-child { box-shadow: inset 3px 0 0 var(--riven); padding-left: 6px; }
    .yours { color: var(--riven); font-size: 12px; margin-left: 4px; }
    tr.grouprow td { padding-top: 8px; border-bottom: 1px solid var(--line); white-space: normal; }
    .level { font-weight: 600; }
    .sum { color: var(--text); }
    td.wrap { white-space: normal; }
    th.now, td.now { color: var(--riven); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const PANEL = new URLSearchParams(location.search).get('panel') || 'summary';
    const WANTED = ['Rarely wanted', 'Okay', 'Good', 'Sought after'];

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function lockTag() {
      const tag = el('span', 'locked');
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 16 16');
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', 'M4 7V5a4 4 0 1 1 8 0v2h1v8H3V7h1zm2 0h4V5a2 2 0 1 0-4 0v2z');
      svg.append(path);
      tag.append(svg, 'locked');
      return tag;
    }

    // Warframe's five-dot disposition scale.
    function dots(value) {
      const filled = value >= 1.31 ? 5 : value >= 1.11 ? 4 : value >= 0.9 ? 3 : value >= 0.7 ? 2 : 1;
      return '●'.repeat(filled) + '○'.repeat(5 - filled);
    }

    const percent = (roll) => `${Math.round(roll * 100)}%`;

    function about(node, a) {
      const meta = el('div', 'meta', 'Riven strength ');
      meta.append(el('span', 'dots', dots(a.disposition)), ` ${a.disposition.toFixed(2)}`);
      node.append(meta);
    }

    function verdict(node, a) {
      if (!a.grade) return;
      const row = el('div', 'facts');
      const fact = (value, className) => {
        const box = el('div', 'fact');
        box.append(el('b', className, value));
        row.append(box);
      };
      fact(`${a.grade.traits} traits`, a.grade.traits.toLowerCase());
      if (a.grade.rolls != null) fact(`${a.grade.rolls}%`);
      node.append(row);
    }

    function stats(node, reading, a, compact) {
      const box = el('ul', 'stats');
      reading.stats.forEach((s, i) => {
        const d = a?.drawn?.[i] || {};
        const row = el('li', d.positive === false ? 'bad' : null);
        const line = el('div', 'line');
        line.append(el('span', 'text', s.text));
        if (s.locked) line.append(lockTag());
        if (d.unknown) line.append(el('span', 'pill', 'unknown trait'));
        else if (d.positive === false) line.append(el('span', `pill ${d.harmless ? 'harmless' : 'hurts'}`, d.harmless ? 'harmless negative' : 'hurts the weapon'));
        else if (d.rating != null) line.append(el('span', `pill r${d.rating}`, WANTED[d.rating]));
        row.append(line);
        if (d.roll != null && compact) line.append(el('span', 'meta', percent(d.roll)));
        if (d.roll != null && !compact) {
          const roll = el('div', 'roll');
          const bar = el('div', 'bar');
          const fill = el('i');
          fill.style.width = percent(d.roll);
          bar.append(fill);
          roll.append(bar, el('span', null, `rolled ${percent(d.roll)} of its range`));
          row.append(roll);
        }
        box.append(row);
      });
      node.append(box);
    }

    function summaryCard(reading, label, options) {
      const node = el('div', options.old ? 'card old' : 'card');
      node.append(el('div', 'label', label), el('div', 'name', reading.name));
      const a = reading.analysis;
      if (a?.error) {
        stats(node, reading, null);
        node.append(el('div', 'note', `Could not look this riven up: ${a.error}`));
        return node;
      }
      if (a) { about(node, a); verdict(node, a); }
      stats(node, reading, a, options.old);
      return node;
    }

    function renderSummary({ current, previous }) {
      const root = document.getElementById('root');
      root.replaceChildren(summaryCard(current, previous ? 'New roll' : 'Your riven', {}));
      if (previous) root.append(summaryCard(previous, 'Before this cycle', { old: true }));
    }

    // "+102.9–125.8%", "x1.28–1.34", "1.7–2.1m".
    function span(trait, r, negative) {
      if (!r) return '–';
      const fixed = (v) => (v >= 10 ? v.toFixed(1) : v.toFixed(2));
      if (trait.unit === 'multiply') return negative ? `x${fixed(1 - r.high)}–${fixed(1 - r.low)}` : `x${fixed(1 + r.low)}–${fixed(1 + r.high)}`;
      const unit = { punch_through: 'm', range: 'm', combo_duration: 's', channeling_damage: '' }[trait.slug] ?? '%';
      return `${negative ? '-' : '+'}${fixed(r.low)}–${fixed(r.high)}${unit}`;
    }



    const pct = (p) => `${(p * 100).toFixed(1)}%`;

    // One trait draw: how many traits it picks from and the chance of each.
    function slot(a) {
      const o = a.outlook;
      const pool = o.anchor.locked ? o.choices : o.eligible;
      return { pool, per: 1 / pool };
    }

    // Summary row for one "Wanted" level: its traits' share of a slot, spelled out.
    function groupRow(a, rating, traits) {
      const row = el('tr', 'grouprow');
      const cell = el('td');
      cell.colSpan = 3;
      cell.append(el('span', `r${rating} level`, WANTED[rating]));
      if (a.outlook) {
        const { per } = slot(a);
        const count = traits.filter((t) => t.next > 0 && t.next < 1).length;
        if (count) cell.append(el('span', 'sum', ` · ${count} × ${pct(per)} = ${pct(count * per)} per slot`));
      }
      row.append(cell);
      return row;
    }

    function renderTraits({ current }) {
      const a = current.analysis;
      const root = document.getElementById('root');
      const node = el('div', 'card');
      if (!a || a.error) {
        node.append(el('div', 'label', 'Traits'), el('div', 'note', a?.error || 'Looking this riven up…'));
        return root.replaceChildren(node);
      }
      const table = el('table');
      const head = el('tr');
      for (const title of ['Trait', 'As positive', 'Per slot']) head.append(el('th', null, title));
      table.append(head);
      for (const rating of [3, 2, 1, 0]) {
        const traits = a.pool.filter((t) => t.rating === rating);
        if (!traits.length) continue;
        table.append(groupRow(a, rating, traits));
        for (const t of traits) {
          const row = el('tr', t.drawn ? 'mine' : null);
          const name = el('td', null, t.name);
          if (t.drawn) name.append(el('span', 'yours', t.drawn.locked ? 'locked' : t.drawn.roll != null ? `yours, ${percent(t.drawn.roll)}` : 'yours'));
          const next = t.next === 1 ? 'kept' : t.next ? pct(slot(a).per) : '–';
          row.append(name, el('td', 'range', span(t, t.good, false)), el('td', 'range now', next));
          table.append(row);
        }
      }
      node.append(table);
      root.replaceChildren(node);
    }

    window.warframe.onOverlay((state) => (PANEL === 'traits' ? renderTraits : renderSummary)(state));
  </script>
</body>
</html>
