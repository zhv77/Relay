name: Build Windows installer

# Build only when explicitly requested. No automatic releases or publishing.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check packaged app
        shell: pwsh
        run: |
          $installerApp = Join-Path $PWD 'dist/win-unpacked/Warframe Trader.exe'
          $checkProcess = Start-Process -FilePath $installerApp -ArgumentList '--package-check' -WindowStyle Hidden -PassThru
          if (-not $checkProcess.WaitForExit(60000)) {
            Stop-Process -Id $checkProcess.Id
            throw 'Packaged app check timed out'
          }
          if ($checkProcess.ExitCode -ne 0) { throw "Packaged app check failed: $($checkProcess.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: Warframe-Trader-Windows-${{ github.run_number }}
          path: |
            dist/Warframe-Trader-Setup-*-x64.exe
            dist/SHA256SUMS.txt
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 30
